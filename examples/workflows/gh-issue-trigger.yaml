apiVersion: core/v1
kind: Workflow
metadata:
  name: gh-issue-trigger
  scope: global
  labels:
    core/origin: custom
spec:
  enabled: false                    # 声明层模具——实例化（apply 到 docsRoot）后按需启用
  undeletable: false
  connector: connector-ops/connectops-gh
  services:
    involved: [self-recursive-core, developer-system, deploy-system]
    mode: act
  llm:
    provider: openai-default
    model: "reasoning-tier"
    tier: high
    nodeMapping:
      gh-issue-fetch:   {tier: low,      model: "flash-tier"}
      batch-judge:      {tier: high,     model: "reasoning-tier"}
      approval-gate:    {tier: low,      model: "flash-tier"}   # 自审批判决=ops_core_inner_agent 低档
      doc-apply:        {tier: standard, model: "standard-tier"}
      developer-system: {tier: high,     model: "reasoning-tier"}
      verify:           {tier: low,      model: "flash-tier"}
      gh-release:       {tier: low,      model: "flash-tier"}
      self-update:      {tier: low,      model: "flash-tier"}
      merge-results:    {tier: standard, model: "standard-tier"}
      issue-feedback:   {tier: low,      model: "flash-tier"}
  globalRuleRefs: [rule/rule_eng, rule/rule_doc, rule/rule_ux, rule/rule_pub]
  logSource:
    events: [GhIssueEvent]
    minLevel: info
    services: [self-recursive-core]
    keywordMatch: ""
    timer:
      enabled: true                 # 入口 1：定时整理（每 1h 批量全量扫描未 close Issue）
      interval: 1h
      cron: "0 * * * *"
    collector:
      connector: connectops-gh
      op: issue-list
      query: "state:open label:needs-triage"
      autoDevelopOnMissing: true
  triggers:
    events:
      types: [GhIssueEvent]
      minLevel: info
    timer:
      resync: 1h
      enabled: true
      interval: 1h
      cron: "0 * * * *"
  entryPoints:
    - {node: gh-issue-fetch, phase: Idle, enabled: true, events: [GhIssueEvent], description: "入口 2：connectops-gh watch 桥自产 GhIssueEvent（新开/重开 Issue）即时进入——单条入口不声明 fanout，一事件一 run"}
  ingest:
    dedup: {window: 10m}
    group: {by: issue, max: 50}
    filterLevels: [info, warn, error, fatal]
  approval:                         # 2026-11-28 用户裁定：builtin workflow 自审批缺省（规则 23）
    mode: agent                     # LLM 按 autoCriteria 自主判决+DocumentDiff 判决文档留痕；超 maxRiskLevel 回退人工
    autoCriteria: "Issue 分类明确、修复方案只涉及文档更新或非破坏性代码修改且测试全绿时自动批准；涉及删库/权限/生产配置转人工"
    maxRiskLevel: low
  systemBindings:
    developerSystem:
      service: developer-system
      resolution: default
      connector: connectops-developer
      op: develop
      conventions:
        branchPrefix: "agent/"
        worktreeDir: "worktrees/"
        tmpDir: "tmp/"
        maxFileLines: 800
    deploySystem:
      service: deploy-system
      resolution: default
      connector: connectops-gh
      op: release-create            # 发版=github release（build 走 gh workflow-dispatch）
  verification:
    mode: both
    connector: connectops-code-audit
    op: audit
    onFail: retry-develop
    conditions:
      - {id: lint-rules, kind: code, title: "代码 Lint 与规则审核", command: "connectops-code-audit/audit", required: true}
      - {id: gh-ci-green, kind: test, title: "GitHub CI 全绿（gh 查 run 状态）", command: "connectops-gh/check-runs", required: true}
  phases:
    # —— 父链：批量合判 → 扇出 → 合并 → 回评 ——
    - {name: gh-issue-fetch,   phase: Idle,             title: "1. 拉取待整理 Issue（issue-list 全量）", unit: connectops, connector: connectops-gh, op: issue-list, params: {repo: core_system_workservice, state: open}, provider: openai-default, modelTier: low,      entryEvents: [GhIssueEvent]}
    - {name: batch-judge,      phase: Analyzing,        title: "2. 批量合判（一次分析全部 Issue→执行计划 plan[N 修复项]）", unit: agent, op: judge-issues-batch, provider: openai-default, modelTier: high, globalRuleRefs: [rule/rule_eng, rule/rule_doc], planKey: plan}
    - {name: approval-gate,    phase: AwaitingApproval, title: "3. 自审批（mode=agent 判决+DocumentDiff 留痕，超险回退人工）", unit: gate, op: approval-check, provider: openai-default, modelTier: low}
    - {name: fanout-fixes,     phase: Planning,         title: "4. 扇出子 run（每条修复项一 run，parentRun 锚；父 run join 挂起）", unit: workflow, op: gh-issue-trigger, fanout: {from: plan, key: items}, entryNode: doc-apply, join: all, provider: openai-default, modelTier: low}
    - {name: merge-results,    phase: Reporting,        title: "5. 合并子 run 结果（diff/发版/验证证据/失败原因）", unit: agent, op: merge-results, provider: openai-default, modelTier: standard}
    - {name: issue-feedback,   phase: Reporting,        title: "6. 逐 Issue 回评+关闭（真发 issue-comment，回评作者=系统凭据）", unit: connectops, connector: connectops-gh, op: issue-comment, params: {repo: core_system_workservice, body: "gh-issue-trigger run 已处理该 issue（fix/发布证据见 run 卡与 release）。"}, provider: openai-default, modelTier: low}
    # —— 子链：单条修复项执行（子 run 从 doc-apply 受理，parentRun 锚回填父 run）——
    - {name: doc-apply,        phase: Planning,         title: "S1. Doc Apply（结论/BugDoc 落稿）",   unit: agent,      op: apply-doc,   provider: openai-default, modelTier: standard, globalRuleRefs: [rule/rule_doc], entryEvents: [sub:plan-item]}
    - {name: developer-system, phase: Executing,        title: "S2. 修复/文档更新（真 session 执行，build 走 gh）", unit: service, connector: connectops-developer, op: develop, provider: openai-default, modelTier: high, globalRuleRefs: [rule/rule_eng, rule/rule_ux, rule/rule_pub], service: developer-system, contextPassing: {fields: [planItem, judge]}}
    - {name: verify,           phase: Verifying,        title: "S3. 验收（CI+规则审核）",              unit: connectops, connector: connectops-code-audit, op: audit, params: {target: "/home/friddle/Project/self-recursive-agent/core_system_workservice"}, provider: openai-default, modelTier: low}
    - {name: gh-release,       phase: Deploying,        title: "S4. docs git push + github release 发版（复合发布）", unit: connectops, connector: connectops-docs, op: release-publish, params: {repo: core_system_workservice}, provider: openai-default, modelTier: low}
    - {name: self-update,      phase: Deploying,        title: "S4.5 自更新（下载最新产物+重启服务）",  unit: agent, op: self-update-restart, provider: openai-default, modelTier: low}
  transitions:
    # 父链
    - {from: Idle,             on: advance,          to: Analyzing}
    - {from: Idle,             on: "entry:GhIssueEvent", to: Analyzing}
    - {from: Analyzing,        on: advance,          to: AwaitingApproval}
    - {from: Analyzing,        on: worth_fixing,     to: AwaitingApproval}
    - {from: Analyzing,        on: ignore,           to: Reporting}     # 噪声项合并直达回评归档
    - {from: AwaitingApproval, on: advance,          to: Planning}
    - {from: AwaitingApproval, on: ApprovalGranted,  to: Planning}
    - {from: AwaitingApproval, on: ApprovalRejected, to: Failed}
    - {from: Planning,         on: fanout-complete,  to: Reporting}     # join：全部子 run 落终态后父 run 续行（部分失败不传染，merge 如实汇总）
    # 子链（子 run 从 doc-apply 受理）
    - {from: Planning,         on: advance,          to: Executing}
    - {from: Planning,         on: "entry:sub:plan-item", to: Planning}   # 子 run 受理锚：计划条目驱动
    - {from: Executing,        on: advance,          to: Verifying}
    - {from: Verifying,        on: advance,          to: Deploying}
    - {from: Verifying,        on: retry-develop,    to: Executing}
    - {from: Deploying,        on: advance,          to: Reporting}
  onEscalate: {action: pause, notify: bind-role}
  onFailed:
    backoff: 30s*2^n
    maxAttempts: 3
    rollbackPolicy: by-step
    escalate: {to: root, notify: bind-role}
  trustGate:
    enabled: true                   # github=外部系统，内容先过检验门
    mode: code
    verifierRef: "connectops-code-audit/verify-external"
    onReject: ask
  brakes:
    cooldown: 5m
    maxMutationsPerTick: 8
    avoidRepeatFix: true
  regression:
    statusWriteback: true
    bugDocPolicy: invalidate        # 临时 BugDoc 默认标记失效；可改 delete / keep，或直接删除该动作项
    cleanTempBugDoc: false
    targetPhaseOnConverge: InSync
    postActions:
      - {id: bugdoc-lifecycle, kind: doc-lifecycle, targetDocType: BugDoc, action: invalidate, enabled: true, title: "临时 BugDoc 收尾处理（可选：invalidate / delete / keep，可增删此项）"}
      - {id: status-insync,    kind: status-writeback, targetPhase: InSync, enabled: true, title: "回写 ServiceInstance.status.phase = InSync"}
    reports: [DriftReport, SessionLog]
