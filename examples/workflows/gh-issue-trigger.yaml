apiVersion: core/v1
kind: Workflow
metadata:
  name: gh-issue-trigger
  scope: global
  labels:
    core/origin: custom
spec:
  enabled: true                     # 实例已落地（2026-11-28 全链实跑——enabled:false=模具态 v0.58b 门拦 run 不落，rv9/rv10 回灌曾回退此位致触发无 run 实证）
  undeletable: false
  connector: connector-ops/connectops-gh
  services:
    involved: [self-recursive-core, developer-system, deploy-system]
    mode: act
  llm:
    provider: openai-default
    model: "reasoning-tier"
    tier: high
    nodeMapping:
      gh-issue-fetch:   {tier: low,      model: "flash-tier"}
      batch-judge:      {tier: high,     model: "reasoning-tier"}
      approval-gate:    {tier: low,      model: "flash-tier"}   # 自审批判决=ops_core_inner_agent 低档
      doc-apply:        {tier: standard, model: "standard-tier"}
      developer-system: {tier: high,     model: "reasoning-tier"}
      verify:           {tier: low,      model: "flash-tier"}
      gh-release:       {tier: low,      model: "flash-tier"}
      deploy-system:    {tier: low,      model: "flash-tier"}
      repo-push:        {tier: low,      model: "flash-tier"}
      merge-results:    {tier: standard, model: "standard-tier"}
      issue-feedback:   {tier: low,      model: "flash-tier"}
  globalRuleRefs: [rule/rule_eng, rule/rule_doc, rule/rule_ux, rule/rule_pub]
  logSource:
    events: [GhIssueEvent]
    minLevel: info
    services: [self-recursive-core]
    keywordMatch: ""
    timer:
      enabled: true                 # 入口 1：定时整理（每 1h 批量全量扫描未 close Issue）
      interval: 1h
      cron: "0 * * * *"
    collector:
      connector: connectops-gh
      op: issue-list
      query: "state:open label:needs-triage"
      autoDevelopOnMissing: true
  triggers:
    events:
      types: [GhIssueEvent]
      minLevel: info
    timer:
      resync: 1h
      enabled: true
      interval: 1h
      cron: "0 * * * *"
  entryPoints:
    - {node: gh-issue-fetch, phase: Idle, enabled: true, events: [GhIssueEvent], description: "入口：connectops-gh watch 桥自产 GhIssueEvent（新开/重开 Issue）即时进入——一事件一 run，run 内 batch-judge 合判全量批再扇出多链（2026-11-28 用户令「issuse是一批的。judge判断哪些要下发」）"}
  ingest:
    dedup: {window: 10m}
    group: {by: issue, max: 50}
    filterLevels: [info, warn, error, fatal]
  approval:                         # 2026-11-28 用户裁定：builtin workflow 自审批缺省（规则 23）
    mode: agent                     # LLM 按 autoCriteria 自主判决+DocumentDiff 判决文档留痕；超 maxRiskLevel 回退人工
    autoCriteria: "Issue 分类明确、修复方案只涉及文档更新或非破坏性代码修改且测试全绿时自动批准；涉及删库/权限/生产配置转人工"
    maxRiskLevel: low
  systemBindings:
    developerSystem:
      service: developer-system
      resolution: default
      connector: connectops-developer
      op: develop
      conventions:
        branchPrefix: "agent/"
        worktreeDir: "worktrees/"
        tmpDir: "tmp/"
        maxFileLines: 800
    deploySystem:
      service: deploy-system
      resolution: default
      connector: connectops-gh
      op: release-create            # 发版=github release（build 走 gh workflow-dispatch）
  verification:
    mode: both
    connector: connectops-code-audit
    op: audit
    onFail: retry-develop
    conditions:
      - {id: lint-rules, kind: code, title: "代码 Lint 与规则审核", command: "connectops-code-audit/audit", required: true}
      - {id: gh-ci-green, kind: test, title: "GitHub CI 全绿（gh 查 run 状态）", command: "connectops-gh/check-runs", required: true}
  # 相位拓扑（2026-11-28 批量 fan-out 定型——父链+子链同一对象两段拓扑；相位词=节点落点锚）：
  #   父链：Idle(拉批) → Analyzing(batch-judge 合判) → AwaitingApproval(自审批) → Planning(fanout 扇出多链)
  #        → Reporting(merge 交叉汇总) → [release 判断边] → Releasing(repo-push 交叉汇总提交)
  #   子链：Planning(doc-apply 落稿) → Executing(developer-system 会话拉代码/编辑/build/提交)
  #        → Verifying(审计) → Feedback(逐 issue 回评——闭环反馈)；release 判断边支线
  #        → Deploying(gh-release 日 tag) → Delivering(deploy-system 部署/重启) → Feedback
  phases:
    # —— 父链：批量合判 → 扇出 → 交叉汇总 → 提交 push ——
    - {name: gh-issue-fetch,   phase: Idle,             title: "1. 拉取待整理 Issue（issue-list 全量）", unit: connectops, connector: connectops-gh, op: issue-list, params: {repo: core_system_workservice, state: open}, provider: openai-default, modelTier: low,      entryEvents: [GhIssueEvent]}
    - {name: batch-judge,      phase: Analyzing,        title: "2. 批量合判（一次分析全部 Issue→执行计划 WorkflowPlan[fix/defer 项]）", unit: agent, executor: inner, op: judge-issues-batch, provider: openai-default, modelTier: high, globalRuleRefs: [rule/rule_eng, rule/rule_doc]}
    - {name: approval-gate,    phase: AwaitingApproval, title: "3. 自审批（mode=agent 判决+DocumentDiff 留痕，超险回退人工）", unit: gate, op: approval-check, provider: openai-default, modelTier: low}
    - {name: fanout-fixes,     phase: Planning,         title: "4. 扇出子 run（每计划项一 run 多链并行，parentRun 锚；父 run join 等全部终态）", unit: workflow, op: gh-issue-trigger, fanout: {from: plan, key: items}, entryNode: doc-apply, join: all, provider: openai-default, modelTier: low}
    - {name: merge-results,    executor: inner, phase: Reporting,        title: "5. 交叉汇总（子链终态现查→汇总稿；decision=release 才入发版支线）", unit: agent, op: merge-results, provider: openai-default, modelTier: standard}
    - {name: repo-push,        phase: Releasing,        title: "6. 交叉汇总提交（agent/* 修复分支并入基线→push；release 判断边才达）", unit: connectops, connector: connectops-gh, op: repo-push, params: {repo: core_system_workservice, dir: "/home/friddle/Project/self-recursive-agent/core_system_workservice", branchPrefix: "agent/", baseBranch: main}, provider: openai-default, modelTier: low}
    # —— 子链：单条计划项执行（子 run 从 doc-apply 受理，parentRun 锚回填父 run）——
    - {name: doc-apply,        executor: inner, phase: Planning,         title: "S1. Doc Apply（计划项落稿：fix=修复要点/defer=为什么不做）",   unit: agent,      op: apply-doc,   provider: openai-default, modelTier: standard, globalRuleRefs: [rule/rule_doc], entryEvents: [sub:plan-item]}
    - {name: developer-system, phase: Executing,        title: "S2. 修复执行（developer-system agent：拉代码/分支/编辑/build/提交——作业定义在 ServiceDesc）", unit: service, op: develop, provider: openai-default, modelTier: high, globalRuleRefs: [rule/rule_eng, rule/rule_ux, rule/rule_pub], service: developer-system, contextPassing: {fields: [planItem, judge, issue]}}
    - {name: verify,           phase: Verifying,        title: "S3. 验收（CI+规则审核）",              unit: connectops, connector: connectops-code-audit, op: audit, params: {target: "/home/friddle/Project/self-recursive-agent/core_system_workservice"}, provider: openai-default, modelTier: low}
    - {name: gh-release,       phase: Deploying,        title: "S4. docs git push + github release 发版（复合发布，日 tag 一天至多一个）", unit: connectops, connector: connectops-docs, op: release-publish, params: {repo: core_system_workservice}, provider: openai-default, modelTier: low}
    - {name: deploy-system,    phase: Delivering,       title: "S4.5 部署/重启（deploy-system agent：作业定义在 ServiceDesc）",  unit: service, service: deploy-system, op: deploy, provider: openai-default, modelTier: low}
    - {name: issue-feedback,   phase: Feedback,         title: "S5. 逐 Issue 回评（真发 issue-comment——做了/为什么不做都有反馈，闭环）", unit: connectops, connector: connectops-gh, op: issue-comment, params: {repo: core_system_workservice, body: "gh-issue-trigger 自动修复链已处理该 issue（执行留痕见 run 卡与 DocumentDiff）。"}, provider: openai-default, modelTier: low}
  transitions:
    # 父链
    - {from: Idle,             on: advance,          to: Analyzing}
    - {from: Idle,             on: "entry:GhIssueEvent", to: Analyzing}
    - {from: Analyzing,        on: advance,          to: AwaitingApproval}
    - {from: Analyzing,        on: worth_fixing,     to: AwaitingApproval}   # 判断边：batch-judge 有可下发项
    - {from: Analyzing,        on: ignore,           to: Reporting}          # 判断边：整批噪声——直达交叉汇总归档
    - {from: AwaitingApproval, on: advance,          to: Planning}
    - {from: AwaitingApproval, on: ApprovalGranted,  to: Planning}
    - {from: AwaitingApproval, on: ApprovalRejected, to: Failed}
    - {from: Planning,         on: fanout-complete,  to: Reporting}          # join：全部子 run 落终态后父 run 续行（部分失败不传染，merge 如实汇总）
    #   Reporting 无 advance 行=有意：merge 完成即收束（默认跳过发版——用户裁定「每次 fix 不一定
    #   就要打 tag」）；仅 merge judge 判定大规模批完成（decision=release）才沿判断边入 Releasing。
    - {from: Reporting,        on: release,          to: Releasing}
    # 子链（子 run 从 doc-apply 受理）
    - {from: Idle,             on: "entry:sub:plan-item", to: Planning}      # 子 run 受理锚：entry 查表 from=首相位 Idle（表行 from 写 Planning 查不中——rv14 修）
    - {from: Planning,         on: advance,          to: Executing}
    - {from: Planning,         on: defer,            to: Feedback}           # 判断边：defer 项不修复直达回评（为什么不做——不做也有反馈）
    - {from: Executing,        on: advance,          to: Verifying}
    # —— 子链发版分叉（2026-11-28 用户裁决「默认整体大规模功能修复完成…judge判断后……跳过这一步
    # 可以在workflow做分叉」）：advance=默认跳过发版直落回评（每 fix 不发版是缺省）；release=
    # 判断边（verify 侧 decision 词或 jev 判定回传，引擎查表沿判断边走）；Deploying 日 tag 策略
    # （connectops-docs release-publish：tag 缺席派生 v<UTC 日期>，当日已发=skipped——一天至多一个）。
    - {from: Verifying,        on: advance,          to: Feedback}           # 默认：跳过发版直落回评
    - {from: Verifying,        on: release,          to: Deploying}          # 判断边：大规模批完成才发版
    - {from: Verifying,        on: retry-develop,    to: Executing}
    - {from: Deploying,        on: advance,          to: Delivering}
    - {from: Delivering,       on: advance,          to: Feedback}
    #   Feedback 无 advance 行=有意：回评发完即收束（子链闭环终点——做了/为什么不做都已反馈）。
  onEscalate: {action: pause, notify: bind-role}
  onFailed:
    backoff: 30s*2^n
    maxAttempts: 3
    rollbackPolicy: by-step
    escalate: {to: root, notify: bind-role}
  trustGate:
    enabled: true                   # github=外部系统，内容先过检验门
    mode: code
    verifierRef: "connectops-code-audit/verify-external"
    onReject: ask
  brakes:
    cooldown: 5m
    maxMutationsPerTick: 8
    avoidRepeatFix: true
  regression:
    statusWriteback: true
    bugDocPolicy: invalidate        # 临时 BugDoc 默认标记失效；可改 delete / keep，或直接删除该动作项
    cleanTempBugDoc: false
    targetPhaseOnConverge: InSync
    postActions:
      - {id: bugdoc-lifecycle, kind: doc-lifecycle, targetDocType: BugDoc, action: invalidate, enabled: true, title: "临时 BugDoc 收尾处理（可选：invalidate / delete / keep，可增删此项）"}
      - {id: status-insync,    kind: status-writeback, targetPhase: InSync, enabled: true, title: "回写 ServiceInstance.status.phase = InSync"}
    reports: [DriftReport, SessionLog]
